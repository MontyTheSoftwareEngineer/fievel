[package]
name = "fievel"
version = "1.2.0"
edition = "2021"
description = "Keyboard remapping and mouse control for Linux and macOS"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.13.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rustix = { version = "1", features = ["event", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = true
strip = true
