[package]
name = "fievel"
version = "1.0.0"
edition = "2021"
description = "Hold F3 for keyboard-driven mouse control on Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.13.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "fs"] }

[profile.release]
lto = true
strip = true
